<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 · Utopia Lite</title>
  <style>
    * { box-sizing: border-box; }
    html { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      color: #242a33;
      font: 16px/1.5 "Microsoft YaHei", "Segoe UI", sans-serif;
      background: #111922;
    }
    .login-page {
      position: relative;
      isolation: isolate;
      min-height: 100vh;
      display: flex;
      align-items: center;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 18% 72%, #214440 0, transparent 38%),
        radial-gradient(ellipse at 80% 6%, #493039 0, transparent 36%),
        linear-gradient(135deg, #182630 0%, #111922 60%, #1b2029 100%);
    }
    .login-page::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      opacity: .18;
      background-image: linear-gradient(#ffffff16 1px, transparent 1px), linear-gradient(90deg, #ffffff16 1px, transparent 1px);
      background-size: 64px 64px;
      mask-image: linear-gradient(to right, #000, transparent 88%);
    }
    .login-layout {
      width: min(1480px, 100%);
      min-height: 100vh;
      margin: 0 auto;
      padding: 46px clamp(28px, 6vw, 88px);
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(340px, 460px);
      align-items: center;
      gap: clamp(48px, 6vw, 104px);
    }
    .introduction {
      position: relative;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-self: stretch;
      color: #f3f5f6;
    }
    .brand { display: flex; align-items: center; gap: 12px; font-size: 18px; font-weight: 700; letter-spacing: .01em; }
    .mark {
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      border-radius: 9px;
      background: #a83f58;
      color: white;
      font-size: 23px;
      box-shadow: 0 8px 24px #a83f5838;
    }
    .brand-subtitle { margin-top: 1px; color: #aab8bf; font-size: 11px; font-weight: 400; letter-spacing: .08em; }
    .hero-copy { position: relative; z-index: 1; margin-top: auto; padding-top: 40px; }
    .eyebrow { color: #b6d3ca; font-size: 11px; font-weight: 700; letter-spacing: .2em; }
    .hero-copy h1 { margin: 16px 0 14px; font-size: clamp(34px, 4vw, 51px); line-height: 1.3; letter-spacing: .02em; }
    .hero-copy p { margin: 0; color: #afbec4; font-size: 15px; line-height: 1.9; }
    .graph-art { width: min(580px, 100%); align-self: center; flex: none; margin-top: 8px; opacity: .9; pointer-events: none; }
    .intro-footer { position: relative; z-index: 1; margin-top: auto; padding-top: 28px; color: #a6bab9; font-size: 12px; letter-spacing: .08em; }
    .intro-footer::before { content: ""; display: inline-block; width: 24px; height: 1px; margin: 0 10px 4px 0; background: #6f9d92; }
    .login-card {
      position: relative;
      z-index: 1;
      width: 100%;
      padding: 42px;
      border: 1px solid #ffffffd9;
      border-radius: 16px;
      background: #fcfcfc;
      box-shadow: 0 28px 80px #080f1859;
    }
    .card-label { color: #a23750; font-size: 11px; font-weight: 700; letter-spacing: .16em; }
    .login-card h2 { margin: 16px 0 8px; color: #252b32; font-size: 27px; line-height: 1.3; }
    .card-description { margin: 0 0 30px; color: #626e78; font-size: 15px; }
    label { display: block; margin: 19px 0 8px; color: #38414a; font-size: 14px; font-weight: 600; }
    input:not([type="hidden"]) { width: 100%; min-height: 52px; padding: 12px 14px; border: 1px solid #d5dce1; border-radius: 7px; background: #fff; color: #252b32; font: inherit; }
    input::placeholder { color: #737f89; }
    input:focus { border-color: #a23750; outline: 2px solid #a2375030; outline-offset: 1px; }
    button { width: 100%; min-height: 52px; margin-top: 28px; border: 0; border-radius: 7px; background: #a23750; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
    button:hover { background: #862c42; }
    button:focus-visible { outline: 2px solid #a23750; outline-offset: 3px; }
    .error { margin: 16px 0 0; color: #b13238; font-size: 13px; }
    .card-footer { margin: 28px 0 0; padding-top: 20px; border-top: 1px solid #edf0f2; color: #68757f; font-size: 12px; text-align: center; }
    @media (max-width: 760px) {
      .login-page { overflow: visible; }
      .login-layout { min-height: 100vh; padding: 28px 22px 40px; grid-template-columns: minmax(0, 1fr); gap: 34px; align-content: center; }
      .introduction { min-height: 0; }
      .hero-copy { margin-top: 46px; padding-top: 0; }
      .hero-copy h1 { font-size: 32px; }
      .hero-copy p { font-size: 14px; }
      .graph-art { position: absolute; width: min(300px, 85%); right: 0; bottom: -42px; margin: 0; opacity: .4; }
      .intro-footer { display: none; }
      .login-card { max-width: 440px; padding: 32px 26px; }
    }
    @media (max-width: 380px) {
      .login-layout { padding-inline: 16px; }
      .hero-copy h1 { font-size: 28px; }
    }
  </style>
</head>
<body>
  <main class="login-page">
    <div class="login-layout">
      <section class="introduction" aria-label="Utopia Lite 介绍">
        <div class="brand">
          <span class="mark">U</span>
          <div>Utopia Lite<div class="brand-subtitle">知识工程工作台</div></div>
        </div>
        <div class="hero-copy">
          <div class="eyebrow">KNOWLEDGE, CONNECTED</div>
          <h1>让知识，彼此连接。</h1>
          <p>从零散的信息到清晰的关联，<br>在这里构建属于你的知识世界。</p>
        </div>
        <svg class="graph-art" viewBox="0 0 660 410" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <defs>
            <radialGradient id="halo"><stop stop-color="#6ac2a8" stop-opacity=".2"/><stop offset="1" stop-color="#6ac2a8" stop-opacity="0"/></radialGradient>
            <linearGradient id="edges" x1="30" y1="50" x2="610" y2="360" gradientUnits="userSpaceOnUse"><stop stop-color="#7dc7b3" stop-opacity=".16"/><stop offset=".55" stop-color="#9ad5c5" stop-opacity=".65"/><stop offset="1" stop-color="#d994a5" stop-opacity=".2"/></linearGradient>
          </defs>
          <circle cx="327" cy="210" r="205" fill="url(#halo)"/>
          <g stroke="url(#edges)" stroke-width="1">
            <path d="M56 232 155 108 262 162 339 80 466 125 574 63M56 232 169 292 262 162 327 252 466 125 524 270 626 222M169 292 240 370 327 252 429 339 524 270M155 108 112 46M339 80 327 252 429 339M466 125 626 222M262 162 524 270"/>
            <path d="M40 316 169 292M574 63 606 150M240 370 429 339" stroke-dasharray="4 7"/>
          </g>
          <g fill="#9ad5c5">
            <circle cx="56" cy="232" r="3"/><circle cx="155" cy="108" r="4"/><circle cx="339" cy="80" r="3"/><circle cx="169" cy="292" r="4"/><circle cx="240" cy="370" r="2"/><circle cx="429" cy="339" r="3"/><circle cx="574" cy="63" r="2"/><circle cx="626" cy="222" r="3"/><circle cx="112" cy="46" r="2"/>
          </g>
          <circle cx="262" cy="162" r="22" fill="#64bfa6" fill-opacity=".09" stroke="#78cbb4" stroke-opacity=".22"/>
          <circle cx="262" cy="162" r="8" fill="#8bd3bd"/>
          <circle cx="327" cy="252" r="31" fill="#64bfa6" fill-opacity=".08" stroke="#78cbb4" stroke-opacity=".3"/>
          <circle cx="327" cy="252" r="12" fill="#a5decb"/>
          <circle cx="466" cy="125" r="22" fill="#d5869d" fill-opacity=".08" stroke="#d5869d" stroke-opacity=".25"/>
          <circle cx="466" cy="125" r="7" fill="#dba2b0"/>
          <circle cx="524" cy="270" r="6" fill="#dba2b0"/>
        </svg>
        <div class="intro-footer">探索关联 · 沉淀知识 · 洞见未来</div>
      </section>
      <section class="login-card" aria-labelledby="login-title">
        <div class="card-label">WELCOME BACK</div>
        <h2 id="login-title">欢迎回来</h2>
        <p class="card-description">登录后进入你的知识工程工作台</p>
        <form method="post" action="/login">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
          <label for="username">账号</label>
          <input id="username" name="username" placeholder="请输入账号" autocomplete="username" required autofocus>
          <label for="password">密码</label>
          <input id="password" name="password" type="password" placeholder="请输入密码" autocomplete="current-password" required>
          {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
          <button type="submit">登录</button>
        </form>
        <p class="card-footer">Utopia Lite · 知识工程工作台</p>
      </section>
    </div>
  </main>
</body>
</html>
